rule:
  id: windows-server-2025-active-control-permissions-sv-278139-rule
  version: WN25-DC-000080
  title: Windows Server 2025 Active Directory SYSVOL directory must have the proper access control permissions.
  severity: high
  role: full
  weight: 10.0
  discussion: '<VulnDiscussion>Improper access permissions for directory data files could allow unauthorized users to read, modify, or delete directory data.


    The SYSVOL directory contains public files (to the domain) such as policies and logon scripts. Data in shared subdirectories are replicated to all domain controllers in a domain.</VulnDiscussion><FalsePositives></FalsePositives><FalseNegatives></FalseNegatives><Documentable>false</Documentable><Mitigations></Mitigations><SeverityOverrideGuidance></SeverityOverrideGuidance><PotentialImpacts></PotentialImpacts><ThirdPartyTools></ThirdPartyTools><MitigationControl></MitigationControl><Responsibility></Responsibility><IAControls></IAControls>'
  requires: []
  conflicts: []
  applicability: []
  parameters: {}
  organizational_input_requirements: {}
  assessment_choices:
    automated:
      assessment: windows-server-2025-control-permissions-sv-278139-assessment
  default_assessment_choice: automated
